<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>TheVibeRoom</title>

<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;600;800&display=swap" rel="stylesheet">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Vazirmatn,sans-serif;
}


body{

height:100vh;

display:flex;
align-items:center;
justify-content:center;

overflow:hidden;

background:

radial-gradient(circle at 20% 20%,
rgba(0,170,255,.35),
transparent 35%),

radial-gradient(circle at 80% 80%,
rgba(170,0,255,.35),
transparent 35%),

linear-gradient(135deg,#020617,#090014);


position:relative;

}


/* نورهای متحرک */

body::before{

content:"";

position:absolute;

width:700px;
height:700px;

background:

radial-gradient(
circle,
rgba(0,200,255,.25),
transparent 65%
);


top:-300px;
left:-250px;


animation:

move1 15s infinite alternate ease-in-out;


}



body::after{

content:"";

position:absolute;

width:650px;
height:650px;


background:

radial-gradient(
circle,
rgba(168,85,247,.25),
transparent 65%
);


bottom:-300px;
right:-250px;


animation:

move2 18s infinite alternate ease-in-out;


}



@keyframes move1{

from{
transform:translate(0,0);
}

to{
transform:translate(150px,120px);
}

}


@keyframes move2{

from{
transform:translate(0,0);
}

to{
transform:translate(-150px,-100px);
}

}





/* ذرات */

.star{

position:absolute;

width:3px;
height:3px;

background:white;

border-radius:50%;

opacity:.5;

animation:

starMove 12s infinite linear;

}


@keyframes starMove{

from{

transform:translateY(100vh);

}

to{

transform:translateY(-20vh);

}

}





/* کارت شیشه ای */

.card{

position:relative;

z-index:5;


width:90%;

max-width:420px;


padding:40px 25px;


border-radius:35px;


background:

rgba(255,255,255,.10);



backdrop-filter:

blur(35px);



-webkit-backdrop-filter:

blur(35px);



border:

1px solid rgba(255,255,255,.25);



box-shadow:


0 30px 80px rgba(0,0,0,.45),

inset 0 0 40px rgba(255,255,255,.08);



text-align:center;



animation:

show 1s ease;


}





@keyframes show{

from{

opacity:0;

transform:

translateY(40px)

scale(.9);

}


to{

opacity:1;

transform:none;

}


}




/* راکت */

.rocket{

font-size:75px;


display:inline-block;


filter:

drop-shadow(0 0 25px #38bdf8);


animation:

float 3s infinite ease-in-out;


}



@keyframes float{

50%{

transform:translateY(-15px);

}

}





h1{

margin-top:20px;

font-size:25px;

font-weight:800;

color:white;

}



p{

margin-top:20px;

color:#ddd;

line-height:2;

font-size:15px;

}




/* لودر شیشه ای */

.loader{

width:60px;

height:60px;

margin:30px auto;



border-radius:50%;


border:

5px solid rgba(255,255,255,.15);



border-top-color:#6ddcff;



box-shadow:

0 0 35px #38bdf8;



animation:

spin 1s linear infinite;


}



@keyframes spin{

to{

transform:rotate(360deg);

}

}





/* برند */

.brand{

font-size:23px;

font-weight:800;



background:

linear-gradient(
90deg,
#00d9ff,
#c084fc
);



-webkit-background-clip:text;


color:transparent;


}





/* دکمه شیشه ای */

.btn{

margin-top:30px;

padding:15px;


border-radius:22px;



background:

rgba(255,255,255,.12);



backdrop-filter:

blur(20px);



border:

1px solid rgba(255,255,255,.3);



color:white;


font-size:17px;


opacity:0;


transform:translateY(20px);


transition:.8s;



box-shadow:

0 0 30px rgba(168,85,247,.35);


}




.btn.show{

opacity:1;

transform:none;


}


</style>

</head>



<body>


<script>

for(let i=0;i<18;i++){

let s=document.createElement("div");

s.className="star";


s.style.left=Math.random()*100+"%";


s.style.animationDelay=Math.random()*12+"s";


s.style.animationDuration=
(8+Math.random()*8)+"s";


document.body.appendChild(s);

}

</script>




<div class="card">


<div class="rocket">
🚀
</div>



<h1>
این قابلیت به‌زودی فعال می‌شود
</h1>


<p>
در حال آماده‌سازی یک تجربه‌ی جدید و جذاب برای شما هستیم.
<br>
کمی صبور باشید...
</p>



<div class="loader"></div>



<div class="brand">
✨ TheVibeRoom
</div>



<div class="btn" id="btn">
به‌زودی برمی‌گردیم 🖤
</div>



</div>



<script>

setTimeout(()=>{

document
.getElementById("btn")
.classList.add("show");


},3000);


</script>


</body>
</html>
