<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>TheVibeRoom</title>

<script src="https://telegram.org/js/telegram-web-app.js"></script>

<style>

body{
margin:0;
height:100vh;
background:linear-gradient(135deg,#050505,#101b3d);
display:flex;
justify-content:center;
align-items:center;
font-family:Arial;
color:white;
}

.box{

width:90%;
max-width:420px;

background:rgba(255,255,255,.1);
backdrop-filter:blur(20px);

border:1px solid rgba(255,255,255,.2);

border-radius:30px;

padding:30px;

text-align:center;

}


.avatar{

width:90px;
height:90px;

border-radius:50%;

border:3px solid #4f8cff;

object-fit:cover;

}


h1{
margin:15px 0 5px;
}


.username{
opacity:.7;
margin-bottom:20px;
}


textarea{

width:100%;
height:150px;

border-radius:20px;

background:#080808;

color:white;

border:none;

padding:15px;

font-size:16px;

}


button{

width:100%;

height:55px;

margin-top:15px;

border:none;

border-radius:20px;

background:linear-gradient(90deg,#3a6eff,#00d4ff);

color:white;

font-size:18px;

}


#admin{

display:none;

margin-top:15px;

background:#222;

}


</style>

</head>


<body>


<div class="box">


<img id="avatar" class="avatar">


<h1 id="name">
TheVibeRoom
</h1>


<div id="username" class="username">
</div>


<textarea id="msg" placeholder="Write your secret..."></textarea>


<button id="send">
✨ Send Secret
</button>


<button id="admin">
⚙️ Admin Panel
</button>


</div>



<script>


const tg = Telegram.WebApp;

tg.ready();
tg.expand();


const user = tg.initDataUnsafe.user;



if(user){


document.getElementById("name").innerHTML =
user.first_name || "User";


document.getElementById("username").innerHTML =
"@" + (user.username || "");


if(user.photo_url){

document.getElementById("avatar").src =
user.photo_url;

}

}



// پنل فقط برای تو

if(user && user.id == 8812851173){

document.getElementById("admin").style.display="block";

}



document.getElementById("send").onclick=function(){


let text=document.getElementById("msg").value;


if(!text){

alert("Write something");

return;

}


alert("Message sent successfully");


}



document.getElementById("admin").onclick=function(){

alert("Admin panel coming...");

}



</script>


</body>
</html>
