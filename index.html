<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>TheVibeRoom</title>

<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
height:100vh;
display:flex;
justify-content:center;
align-items:center;
background:#050505;
overflow:hidden;
}

.card{
width:92%;
max-width:420px;
padding:30px;
border-radius:30px;
background:rgba(255,255,255,.08);
backdrop-filter:blur(18px);
border:1px solid rgba(255,255,255,.15);
text-align:center;
color:white;
}

h1{
font-size:32px;
margin-bottom:10px;
}

p{
opacity:.8;
margin-bottom:20px;
}

textarea{
width:100%;
height:170px;
background:#101010;
border:none;
border-radius:18px;
padding:15px;
color:white;
font-size:16px;
}

button{
margin-top:20px;
width:100%;
height:55px;
border:none;
border-radius:16px;
background:linear-gradient(90deg,#3a6eff,#00d4ff);
color:white;
font-size:18px;
}

</style>
</head>

<body>

<div class="card">

<h1>𝑻𝒉𝒆𝑽𝒊𝒃𝒆𝑹𝒐𝒐𝒎</h1>

<p>Every secret has a story...</p>

<textarea id="message" placeholder="Write your message..."></textarea>

<button id="send">✨ Send Secret</button>

</div>


<script>

const tg = window.Telegram.WebApp;

tg.ready();
tg.expand();


const user = tg.initDataUnsafe.user;


// Supabase

const SUPABASE_URL = "https://rjehesvliixzidgdsnrc.supabase.co";

const SUPABASE_KEY = "sb_publishable_I60TXtFHu2MT-Fm8vul1Ig_5gL1WFLl";

const db = supabase.createClient(
SUPABASE_URL,
SUPABASE_KEY
);



document.getElementById("send").onclick = async ()=>{

const text = document.getElementById("message").value;


if(!text){
alert("Write something first");
return;
}


await db
.from("messages")
.insert({

telegram_id:user?.id,
username:user?.username,
first_name:user?.first_name,
message:text

});


alert("Message sent successfully");

document.getElementById("message").value="";

};


</script>

</body>
</html>
