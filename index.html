
<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>TheVibeRoom</title>

<script src="https://telegram.org/js/telegram-web-app.js"></script>

<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;600;700&display=swap" rel="stylesheet">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Vazirmatn',sans-serif;
}

body{

height:100vh;

display:flex;
justify-content:center;
align-items:center;

background:
radial-gradient(circle at top,#314d96 0%,transparent 35%),
linear-gradient(135deg,#030303,#101b3d);

overflow:hidden;

color:white;

}

body::before{

content:"";

position:absolute;

width:500px;
height:500px;

background:#3b82f6;

filter:blur(180px);

opacity:.18;

border-radius:50%;

top:-180px;
right:-150px;

animation:float 8s ease-in-out infinite;

}

body::after{

content:"";

position:absolute;

width:350px;
height:350px;

background:#7c3aed;

filter:blur(180px);

opacity:.15;

border-radius:50%;

bottom:-120px;
left:-120px;

animation:float2 9s ease-in-out infinite;

}

@keyframes float{

0%{transform:translateY(0);}
50%{transform:translateY(25px);}
100%{transform:translateY(0);}

}

@keyframes float2{

0%{transform:translateY(0);}
50%{transform:translateY(-25px);}
100%{transform:translateY(0);}

}

.box{

position:relative;

z-index:5;

width:92%;
max-width:430px;

padding:28px;

border-radius:35px;

background:rgba(255,255,255,.10);

backdrop-filter:blur(28px);

border:1px solid rgba(255,255,255,.20);

box-shadow:
0 25px 60px rgba(0,0,0,.45);

animation:show .5s ease;

}

@keyframes show{

from{

opacity:0;
transform:translateY(20px);

}

to{

opacity:1;
transform:translateY(0);

}

}

.avatar{

width:95px;
height:95px;

border-radius:50%;

display:block;

margin:auto;

object-fit:cover;

border:3px solid rgba(80,160,255,.8);

box-shadow:
0 0 35px rgba(79,140,255,.8);

}

h1{

margin-top:18px;

font-size:30px;

text-align:center;

font-weight:700;

}

.sub{

margin-top:8px;

text-align:center;

opacity:.8;

font-size:15px;

margin-bottom:25px;

}

textarea{

width:100%;

height:170px;

resize:none;

padding:18px;

border:none;

outline:none;

border-radius:24px;

background:rgba(0,0,0,.35);

color:white;

font-size:15px;

border:1px solid rgba(255,255,255,.18);

transition:.25s;

}

textarea:focus{

border-color:#4f8cff;

box-shadow:0 0 20px rgba(79,140,255,.4);

}

textarea::placeholder{

color:#cfcfcf;

}

button{

width:100%;

height:56px;

margin-top:18px;

border:none;

border-radius:22px;

font-size:17px;

font-weight:700;

cursor:pointer;

color:white;

background:
linear-gradient(90deg,#4f8cff,#5f5fff);

transition:.25s;

box-shadow:
0 0 25px rgba(79,140,255,.45);

}

button:active{

transform:scale(.98);

}

#admin{

display:none;

background:
linear-gradient(90deg,#3b3b3b,#1d1d1d);

}

.toast{

position:fixed;

top:25px;

left:50%;

transform:translateX(-50%) translateY(-80px);

min-width:300px;

background:rgba(30,180,90,.90);

backdrop-filter:blur(15px);

padding:14px 18px;

border-radius:18px;

display:flex;

align-items:center;

justify-content:space-between;

opacity:0;

transition:.4s;

z-index:9999;

overflow:hidden;

}

.toast.show{

opacity:1;

transform:translateX(-50%) translateY(0);

}

.toast-text{

font-size:15px;

font-weight:600;

}

.bar{

width:4px;

height:40px;

background:white;

border-radius:20px;

transform-origin:bottom;

animation:none;

}

@keyframes timer{

from{transform:scaleY(1);}
to{transform:scaleY(0);}

}

.footer{

text-align:center;

margin-top:18px;

opacity:.55;

font-size:13px;

}

</style>

</head>
<body>

<div class="toast" id="toast">

<div class="toast-text">
✅ پیامت با موفقیت ثبت شد
</div>

<div class="bar" id="bar"></div>

</div>

<div class="box">

<img
class="avatar"
src="IMG_20260716_024120_883.jpg"
>

<h1>
TheVibeRoom
</h1>

<div class="sub">
پیام ناشناس خودت رو بنویس 🖤
</div>

<textarea
id="msg"
placeholder="هر چیزی که دوست داری اینجا بنویس..."
></textarea>

<button id="send">
📨 ارسال پیام
</button>

<button id="admin">
👑 پنل مدیریت
</button>

<div class="footer">
Every secret has a story...
</div>

</div>
<script>

const tg = window.Telegram.WebApp;

tg.ready();
tg.expand();

const ADMIN_ID = 8812851173;

// اگر خودت بودی پنل مدیریت نمایش داده شود
const user = tg.initDataUnsafe.user;

if(user && user.id == ADMIN_ID){
    document.getElementById("admin").style.display="block";
}

const toast = document.getElementById("toast");
const bar = document.getElementById("bar");

function showToast(text){

    toast.querySelector(".toast-text").innerHTML = text;

    toast.classList.add("show");

    bar.style.animation = "none";
    void bar.offsetWidth;
    bar.style.animation = "timer 3s linear forwards";

    setTimeout(()=>{
        toast.classList.remove("show");
    },3000);

}

document.getElementById("send").onclick = async ()=>{

    const text = document.getElementById("msg").value.trim();

    if(text.length==0){
        showToast("⚠️ لطفاً پیام خودت را بنویس");
        return;
    }

    const btn=document.getElementById("send");

    btn.disabled=true;
    btn.innerHTML="⏳ در حال ارسال...";

    try{

        const res = await fetch("/api/send",{

            method:"POST",

            headers:{
                "Content-Type":"application/json"
            },

            body:JSON.stringify({

                message:text,

                user_id:user ? user.id : null

            })

        });

        const result=await res.json();

        if(result.success){

            document.getElementById("msg").value="";

            tg.HapticFeedback.notificationOccurred("success");

            showToast("✅ پیامت با موفقیت ثبت شد");

        }else{

            showToast(result.error || "❌ خطا");

        }

    }catch(e){

        showToast("❌ ارتباط با سرور برقرار نشد");

    }

    btn.disabled=false;
    btn.innerHTML="📨 ارسال پیام";

};

document.getElementById("admin").onclick=function(){

    showToast("👑 پنل مدیریت به زودی فعال می‌شود");

};

</script>

</body>

</html>
