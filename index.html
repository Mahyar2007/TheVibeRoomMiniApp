<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>TheVibeRoom</title>

<script src="https://telegram.org/js/telegram-web-app.js"></script>

<style>

*{
box-sizing:border-box;
}

body{

margin:0;
height:100vh;

background:
radial-gradient(circle at top,#233b7a,transparent 40%),
linear-gradient(135deg,#020202,#10162f);

display:flex;
justify-content:center;
align-items:center;

font-family:Arial,sans-serif;

color:white;

overflow:hidden;

}


/* نور پشت کارت */

body:before{

content:"";

position:absolute;

width:300px;
height:300px;

background:#4f8cff;

filter:blur(120px);

opacity:.35;

}



/* کارت شیشه ای */

.box{

position:relative;

width:90%;
max-width:420px;

padding:35px 25px;

background:
rgba(255,255,255,0.12);

backdrop-filter:blur(25px);

-webkit-backdrop-filter:blur(25px);

border-radius:35px;

border:1px solid rgba(255,255,255,.25);

box-shadow:
0 20px 50px rgba(0,0,0,.5);

text-align:center;

}



/* عکس */

.avatar{

width:100px;
height:100px;

border-radius:50%;

object-fit:cover;

border:3px solid rgba(255,255,255,.7);

box-shadow:
0 0 30px #4f8cff;

}



/* برند */

h1{

font-size:28px;

margin:18px 0 8px;

letter-spacing:1px;

}



/* خوش آمد */

.username{

opacity:.8;

margin-bottom:25px;

}



/* متن */

textarea{

width:100%;

height:150px;

resize:none;

border-radius:25px;

padding:18px;

font-size:16px;

color:white;

background:

rgba(0,0,0,.35);

border:

1px solid rgba(255,255,255,.2);

outline:none;

backdrop-filter:blur(10px);

}


textarea::placeholder{

color:#aaa;

}



/* دکمه ها */

button{

width:100%;

height:58px;

margin-top:18px;

border-radius:25px;

border:

1px solid rgba(255,255,255,.3);


background:

linear-gradient(
135deg,
rgba(79,140,255,.7),
rgba(0,212,255,.5)
);


color:white;

font-size:18px;

font-weight:bold;

cursor:pointer;

backdrop-filter:blur(15px);

transition:.3s;

}



button:hover{

transform:scale(1.03);

box-shadow:

0 0 25px #00d4ff;

}



#admin{

display:none;

background:

rgba(255,255,255,.15);

}


.small{

font-size:13px;

opacity:.6;

margin-top:15px;

}


</style>

</head>


<body>


<div class="box">


<img id="avatar" class="avatar">


<h1>
TheVibeRoom
</h1>


<div id="name" class="username">
</div>



<textarea id="msg"
placeholder="Write your secret...">
</textarea>



<button id="send">
✨ Send Secret
</button>



<button id="admin">
⚙️ Admin Panel
</button>


<div class="small">
Every secret has a story...
</div>


</div>



<script>


const tg = Telegram.WebApp;

tg.ready();

tg.expand();



const user = tg.initDataUnsafe.user;



if(user){


document.getElementById("name").innerHTML =
"Welcome " + 
(user.first_name || "User")
+
" 👋";



if(user.photo_url){

document.getElementById("avatar").src =
user.photo_url;

}


}



if(user && user.id == 8812851173){

document.getElementById("admin").style.display="block";

}



document.getElementById("send").onclick=function(){


let text =
document.getElementById("msg").value;


if(!text){

alert("Write something");

return;

}


alert("Message sent successfully");


}




document.getElementById("admin").onclick=function(){

alert("Admin panel coming...");

}



</script>


</body>
</html>
