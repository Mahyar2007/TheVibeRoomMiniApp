<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>TheVibeRoom</title>

<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;600;800&display=swap" rel="stylesheet">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Vazirmatn,sans-serif;
}


body{

height:100vh;
overflow:hidden;

display:flex;
align-items:center;
justify-content:center;

background:
radial-gradient(circle at 20% 20%,#0066ff55,transparent 30%),
radial-gradient(circle at 80% 80%,#a855f755,transparent 35%),
linear-gradient(135deg,#020617,#070014);

position:relative;

}


/* نورهای شناور */

body::before{

content:"";

position:absolute;

width:550px;
height:550px;

background:#2563eb;

filter:blur(170px);

opacity:.35;

border-radius:50%;

top:-200px;
left:-150px;

animation:orb1 12s infinite ease-in-out;

}



body::after{

content:"";

position:absolute;

width:500px;
height:500px;

background:#9333ea;

filter:blur(170px);

opacity:.3;

border-radius:50%;

bottom:-200px;
right:-150px;

animation:orb2 14s infinite ease-in-out;

}



@keyframes orb1{

50%{

transform:translate(150px,100px);

}

}



@keyframes orb2{

50%{

transform:translate(-120px,-120px);

}

}



/* ذرات */

.particle{

position:absolute;

width:4px;

height:4px;

background:white;

border-radius:50%;

opacity:.6;

box-shadow:0 0 15px white;

animation:move 10s infinite linear;

}



@keyframes move{


0%{

transform:translateY(100vh) scale(.5);

opacity:0;

}


40%{

opacity:1;

}


100%{

transform:translateY(-20vh) scale(1.5);

opacity:0;

}


}



/* کارت */

.card{

position:relative;

z-index:5;

width:90%;

max-width:420px;


padding:40px 25px;


border-radius:30px;


background:

rgba(255,255,255,.08);


backdrop-filter:blur(30px);


border:

1px solid rgba(255,255,255,.18);


box-shadow:

0 0 70px rgba(0,102,255,.25),
0 0 100px rgba(168,85,247,.2);


text-align:center;


animation:

show 1s ease,
glow 5s infinite alternate;


}



@keyframes glow{

from{

box-shadow:

0 0 50px rgba(0,102,255,.25);

}


to{

box-shadow:

0 0 100px rgba(168,85,247,.35);

}

}



@keyframes show{

from{

opacity:0;

transform:translateY(40px) scale(.9);

}


to{

opacity:1;

transform:none;

}

}



/* راکت */

.rocket{

font-size:70px;

display:inline-block;

animation:float 3s infinite ease-in-out;

filter:drop-shadow(0 0 25px #38bdf8);

}



@keyframes float{

50%{

transform:translateY(-15px);

}

}



/* متن */

h1{

margin-top:20px;

font-size:25px;

color:white;

font-weight:800;

}



p{

margin-top:20px;

color:#ddd;

line-height:2;

font-size:15px;

}



/* لودر */

.loader{

width:55px;

height:55px;

margin:30px auto;


border-radius:50%;


border:

5px solid rgba(255,255,255,.15);


border-top-color:#6ddcff;


animation:spin 1s linear infinite;


}



@keyframes spin{

to{

transform:rotate(360deg);

}

}



/* برند */

.brand{

font-size:22px;

font-weight:bold;


background:

linear-gradient(90deg,#00d9ff,#a855f7);


-webkit-background-clip:text;


color:transparent;

}



/* دکمه */

.btn{

margin-top:30px;

padding:15px;

border-radius:20px;


background:

rgba(255,255,255,.1);


border:

1px solid rgba(255,255,255,.2);


color:white;


font-size:17px;


opacity:0;


transform:translateY(20px);


transition:.8s;


box-shadow:

0 0 30px #8b5cf655;

}



.btn.show{

opacity:1;

transform:none;

}



</style>

</head>


<body>



<script>

for(let i=0;i<35;i++){

let p=document.createElement("div");

p.className="particle";


p.style.left=Math.random()*100+"%";


p.style.animationDelay=Math.random()*10+"s";


p.style.animationDuration=(6+Math.random()*10)+"s";


document.body.appendChild(p);

}

</script>




<div class="card">


<div class="rocket">
🚀
</div>



<h1>
این قابلیت به‌زودی فعال می‌شود
</h1>


<p>
در حال آماده‌سازی یک تجربه‌ی جدید و جذاب برای شما هستیم.
<br>
کمی صبور باشید...
</p>



<div class="loader"></div>



<div class="brand">

✨ TheVibeRoom

</div>



<div class="btn" id="btn">

به‌زودی برمی‌گردیم 🖤

</div>


</div>




<script>

setTimeout(()=>{

document.getElementById("btn")
.classList.add("show");


},3000);


</script>


</body>
</html>
