<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>TheVibeRoom</title>

<script src="https://telegram.org/js/telegram-web-app.js"></script>

<style>

*{
box-sizing:border-box;
}

body{
margin:0;
height:100vh;

background:
radial-gradient(circle at top,#283b75,transparent 40%),
linear-gradient(135deg,#020202,#101b3d);

display:flex;
justify-content:center;
align-items:center;

font-family:Arial;
color:white;
}


.box{

width:90%;
max-width:420px;

padding:30px;

background:rgba(255,255,255,.12);

backdrop-filter:blur(25px);

border:1px solid rgba(255,255,255,.25);

border-radius:35px;

text-align:center;

box-shadow:0 20px 60px #000;

}


.avatar{

width:100px;
height:100px;

border-radius:50%;

object-fit:cover;

border:3px solid #4f8cff;

box-shadow:0 0 25px #4f8cff;

background:#222;

}



h1{

margin:18px 0 5px;

}



.username{

opacity:.8;

margin-bottom:25px;

}



textarea{

width:100%;

height:150px;

resize:none;

border-radius:25px;

padding:18px;

font-size:16px;

color:white;

background:rgba(0,0,0,.35);

border:1px solid rgba(255,255,255,.2);

outline:none;

}



button{

width:100%;

height:55px;

margin-top:15px;

border-radius:25px;

border:1px solid rgba(255,255,255,.3);

background:
linear-gradient(90deg,#3a6eff,#00d4ff);

color:white;

font-size:18px;

font-weight:bold;

}



#admin{

display:none;

background:#222;

}


.footer{

margin-top:15px;

font-size:13px;

opacity:.6;

}


</style>

</head>


<body>


<div class="box">


<img id="avatar" class="avatar">


<h1>
TheVibeRoom
</h1>


<div id="userName" class="username">
</div>


<textarea id="msg" placeholder="Write your secret..."></textarea>


<button id="send">
✨ Send Secret
</button>


<button id="admin">
⚙️ Admin Panel
</button>


<div class="footer">
Every secret has a story...
</div>


</div>



<script>


const tg = Telegram.WebApp;

tg.ready();

tg.expand();



const user = tg.initDataUnsafe.user;



if(user){


document.getElementById("userName").innerHTML =
"Welcome " + (user.first_name || "User") + " 👋";



if(user.photo_url){

document.getElementById("avatar").src =
user.photo_url;

}

else{

document.getElementById("avatar").src =
"https://via.placeholder.com/100";

}


}



if(user && user.id == 8812851173){

document.getElementById("admin").style.display="block";

}



document.getElementById("send").onclick=function(){


let text =
document.getElementById("msg").value;


if(!text){

alert("Write something");

return;

}


alert("Secret ready to send ✨");


}



document.getElementById("admin").onclick=function(){

alert("Admin Panel");

}



</script>


</body>
</html>
