<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>TheVibeRoom</title>

<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;600;800&display=swap" rel="stylesheet">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Vazirmatn,sans-serif;
}


body{

height:100vh;
overflow:hidden;

display:flex;
align-items:center;
justify-content:center;

background:
linear-gradient(135deg,#020617,#080014);

position:relative;

}



/* نورهای آرام */

body::before{

content:"";

position:absolute;

width:550px;
height:550px;


background:
radial-gradient(
circle,
rgba(0,150,255,.35),
transparent 65%
);


top:-250px;
left:-200px;


animation:
blueMove 18s infinite alternate ease-in-out;

}



body::after{

content:"";

position:absolute;

width:500px;
height:500px;


background:
radial-gradient(
circle,
rgba(168,85,247,.30),
transparent 65%
);


bottom:-250px;
right:-200px;


animation:
purpleMove 20s infinite alternate ease-in-out;

}




@keyframes blueMove{

from{
transform:translate(0,0);
}

to{
transform:translate(120px,100px);
}

}



@keyframes purpleMove{

from{
transform:translate(0,0);
}

to{
transform:translate(-120px,-80px);
}

}



/* ستاره ها */

.particle{

position:absolute;

width:2px;
height:2px;

background:white;

border-radius:50%;

opacity:.45;

animation:
stars 12s infinite linear;

}



@keyframes stars{

from{

transform:translateY(100vh);

}


to{

transform:translateY(-20vh);

}

}





/* کارت */

.card{

position:relative;

z-index:5;


width:90%;

max-width:420px;


padding:40px 25px;


border-radius:30px;


background:
rgba(255,255,255,.07);


backdrop-filter:blur(20px);


border:
1px solid rgba(255,255,255,.18);


box-shadow:

0 0 60px rgba(0,140,255,.20);


text-align:center;


animation:
show 1s ease;


}




@keyframes show{

from{

opacity:0;

transform:
translateY(30px)
scale(.95);

}


to{

opacity:1;

transform:none;

}

}




/* موشک */

.rocket{

font-size:70px;

display:inline-block;


animation:

rocketFloat 3s infinite ease-in-out;


filter:
drop-shadow(0 0 20px #38bdf8);

}



@keyframes rocketFloat{

50%{

transform:translateY(-15px);

}

}




h1{

margin-top:20px;

font-size:25px;

color:white;

font-weight:800;

}



p{

margin-top:20px;

color:#ddd;

line-height:2;

font-size:15px;

}



/* لودر */

.loader{

width:55px;

height:55px;

margin:30px auto;


border-radius:50%;


border:

5px solid rgba(255,255,255,.15);


border-top-color:#6ddcff;


animation:

spin 1s linear infinite;

}



@keyframes spin{

to{

transform:rotate(360deg);

}

}





/* برند */

.brand{

font-size:22px;

font-weight:800;


background:

linear-gradient(
90deg,
#00d9ff,
#a855f7
);


-webkit-background-clip:text;

color:transparent;

}




/* دکمه */

.btn{

margin-top:30px;

padding:15px;


border-radius:20px;


background:
rgba(255,255,255,.1);


border:

1px solid rgba(255,255,255,.2);


color:white;


font-size:17px;


opacity:0;


transform:translateY(20px);


transition:.8s;


box-shadow:

0 0 25px rgba(168,85,247,.3);

}



.btn.show{

opacity:1;

transform:none;

}


</style>

</head>


<body>



<script>

for(let i=0;i<15;i++){

let p=document.createElement("div");

p.className="particle";


p.style.left=Math.random()*100+"%";


p.style.animationDelay=Math.random()*12+"s";


document.body.appendChild(p);

}

</script>



<div class="card">


<div class="rocket">

🚀

</div>



<h1>
این قابلیت به‌زودی فعال می‌شود
</h1>


<p>
در حال آماده‌سازی یک تجربه‌ی جدید و جذاب برای شما هستیم.
<br>
کمی صبور باشید...
</p>



<div class="loader"></div>



<div class="brand">

✨ TheVibeRoom

</div>



<div class="btn" id="btn">

به‌زودی برمی‌گردیم 🖤

</div>



</div>




<script>

setTimeout(()=>{

document
.getElementById("btn")
.classList.add("show");

},3000);


</script>


</body>
</html>
