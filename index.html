<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>TheVibeRoom</title>

<link rel="stylesheet" href="style.css">

<script src="https://telegram.org/js/telegram-web-app.js"></script>

</head>

<body>

<div class="container">

<div class="card">

<div class="rocket">🚀</div>

<h1>
این قابلیت به‌زودی فعال می‌شود
</h1>

<p class="subtitle">

در حال آماده‌سازی یک تجربه‌ی جدید و جذاب برای شما هستیم.

<br><br>

فعلاً می‌توانید پیام خود را برای ما ارسال کنید.

</p>

<div class="brand">

✨ TheVibeRoom

</div>

<div class="chat-box">

<textarea
id="message"
placeholder="پیام خود را بنویسید..."
></textarea>

<button
class="send-btn"
id="sendBtn">

ارسال پیام 🚀

</button>

<div
class="loader"
id="loader">

</div>

<div
class="status"
id="status">

</div>

</div>

</div>

</div>

<script src="script.js"></script>

</body>

</html>
