<!DOCTYPE html>
<html>
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>TheVibeRoom</title>

<script src="https://telegram.org/js/telegram-web-app.js"></script>

<style>

*{
box-sizing:border-box;
}

body{
margin:0;
height:100vh;

background:
radial-gradient(circle at top,#263b78,transparent 40%),
linear-gradient(135deg,#020202,#101b3d);

display:flex;
justify-content:center;
align-items:center;

font-family:Arial;
color:white;
}

.box{
width:90%;
max-width:420px;

padding:35px 25px;

background:rgba(255,255,255,.12);

backdrop-filter:blur(25px);

border:1px solid rgba(255,255,255,.25);

border-radius:35px;

text-align:center;

box-shadow:0 20px 60px #000;
}

.avatar{
width:100px;
height:100px;

border-radius:50%;

object-fit:cover;

border:3px solid #4f8cff;

box-shadow:0 0 30px #4f8cff;
}

h1{
margin:18px 0 5px;
font-size:28px;
}

.username{
opacity:.8;
margin-bottom:25px;
}

textarea{
width:100%;
height:150px;

resize:none;

border-radius:25px;

padding:18px;

font-size:16px;

color:white;

background:rgba(0,0,0,.35);

border:1px solid rgba(255,255,255,.2);

outline:none;
}

button{
width:100%;
height:58px;

margin-top:15px;

border-radius:25px;

border:1px solid rgba(255,255,255,.3);

background:
linear-gradient(90deg,#3a6eff,#00d4ff);

color:white;

font-size:18px;

font-weight:bold;
}

#admin{
display:none;
background:#222;
}

.footer{
margin-top:15px;
font-size:13px;
opacity:.6;
}

</style>

</head>

<body>

<div class="box">

<img
class="avatar"
src="IMG_20260716_024120_883.jpg"
>

<h1>
𝑻𝒉𝒆𝑽𝒊𝒃𝒆𝑹𝒐𝒐𝒎
</h1>

<div class="username">
Send your secret message ✨
</div>

<textarea
id="msg"
placeholder="Write your secret..."
></textarea>

<button id="send">
✨ Send Secret
</button>

<button id="admin">
⚙️ Admin Panel
</button>

<div class="footer">
Every secret has a story...
</div>

</div>

<script>

const tg = Telegram.WebApp;

tg.ready();
tg.expand();

document.getElementById("send").onclick = async function(){

    const text = document.getElementById("msg").value.trim();

    if(!text){
        alert("Write something");
        return;
    }

    const user = tg.initDataUnsafe.user;

    try{

        const response = await fetch(
            "https://the-vibe-room-mini-app-4jol.vercel.app/api/send",
            {
                method:"POST",
                headers:{
                    "Content-Type":"application/json"
                },
                body:JSON.stringify({
                    message:text,
                    user_id:user ? user.id : null
                })
            }
        );

        const result = await response.json();

        if(result.success){
            alert("Secret sent ✨");
            document.getElementById("msg").value="";
        }else{
            alert(result.error || "Error sending");
        }

    }catch(error){
        alert(error.message || "Connection error");
    }

};

</script>

</body>
</html>
